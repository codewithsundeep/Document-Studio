<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for Android adaptive icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Document Sheet Stack with Shadow -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Base white sheet -->
    <rect x="20" y="20" width="260" height="320" rx="20" fill="#ffffff" />
    <!-- Folded corner effect -->
    <path d="M220 20 L280 80 L220 80 Z" fill="#e2e8f0" />
    <path d="M220 20 L280 80 L220 20 Z" fill="#cbd5e1" opacity="0.6" />

    <!-- Document Lines -->
    <rect x="50" y="110" width="160" height="14" rx="7" fill="#64748b" />
    <rect x="50" y="140" width="200" height="12" rx="6" fill="#94a3b8" />
    <rect x="50" y="165" width="180" height="12" rx="6" fill="#94a3b8" />
    <rect x="50" y="190" width="140" height="12" rx="6" fill="#94a3b8" />

    <!-- 4 Colored Document Format Badges (Word, Excel, PPT, PDF) -->
    <!-- Word Blue W -->
    <rect x="40" y="230" width="48" height="48" rx="10" fill="url(#blueGrad)" />
    <text x="64" y="262" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="middle">W</text>

    <!-- Excel Green X -->
    <rect x="96" y="230" width="48" height="48" rx="10" fill="url(#greenGrad)" />
    <text x="120" y="262" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="middle">X</text>

    <!-- PowerPoint Orange P -->
    <rect x="152" y="230" width="48" height="48" rx="10" fill="url(#orangeGrad)" />
    <text x="176" y="262" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="middle">P</text>

    <!-- PDF Red PDF -->
    <rect x="208" y="230" width="48" height="48" rx="10" fill="url(#redGrad)" />
    <text x="232" y="261" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="18" text-anchor="middle">PDF</text>
  </g>
</svg>
